<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Buat Password Baru - NursePulse Academy</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'background': '#F8F9FA',
                        'surface-card-white': '#FFFFFF',
                        'surface-container-lowest': '#FFFFFF',
                        'surface-container-low': '#F3F4F6',
                        'surface-container': '#E5E7EB',
                        'surface-container-high': '#D1D5DB',
                        'surface-bright': '#FFFFFF',
                        'carbon-black': '#0F1417',
                        'soft-gray': '#E2E8F0',
                        'royal-purple': '#6045F4',
                        'primary': '#6045F4',
                        'primary-container': '#7C64F6',
                        'primary-fixed': '#E8E5FE',
                        'secondary': '#00877A',
                        'neon-mint': '#53E6D4',
                        'secondary-fixed': '#C6F8F2',
                        'secondary-fixed-dim': '#53E6D4',
                        'ce-credit-gold': '#F59E0B',
                        'clinical-danger': '#EF4444',
                        'error-container': '#FEE2E2',
                        'on-surface': '#0F1417',
                        'on-surface-variant': '#475569',
                        'outline': '#94A3B8',
                        'outline-variant': '#CBD5E1',
                    },
                    fontFamily: {
                        'headline-lg': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'headline-md': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'headline-sm': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'title-md': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'body-md': ['"Source Sans 3"', '"Manrope"', 'sans-serif'],
                        'body-sm': ['"Source Sans 3"', '"Manrope"', 'sans-serif'],
                        'label-md': ['"Manrope"', 'sans-serif'],
                        'label-caps': ['"Plus Jakarta Sans"', 'sans-serif'],
                        'metric-digit': ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body class="bg-[#F5F3FF] min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block">
                <img src="logo/logo.png" alt="NursePulse Academy" class="h-12 w-auto mx-auto object-contain" onerror="this.onerror=null; this.src='https://placehold.co/180x45/6045f4/ffffff?text=NursePulse';">
            </a>
            <p class="text-xs text-outline font-label-caps mt-2 uppercase tracking-wider">Portal Pembelajaran &amp; Akreditasi Perawat</p>
        </div>

        <!-- Auth Card -->
        <div class="bg-surface-card-white rounded-3xl p-6 sm:p-8 shadow-xl border border-soft-gray">
            
    <h2 class="text-2xl font-headline-md font-bold text-carbon-black mb-1">Buat Password Baru</h2>
    <p class="text-xs text-on-surface-variant font-body-md mb-6">Silakan buat kata sandi yang aman untuk akun perawat Anda.</p>

    <form onsubmit="event.preventDefault(); window.location='dashboard.html';" novalidate class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-carbon-black mb-1" for="newPass">Password Baru</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-2.5 text-outline text-[18px]">lock</span>
                <input type="password" id="newPass" value="password123" class="w-full pl-9 pr-3 py-2.5 border border-outline-variant rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-royal-purple" placeholder="Minimal 8 karakter">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-carbon-black mb-1" for="confirmPass">Konfirmasi Password</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-2.5 text-outline text-[18px]">lock_reset</span>
                <input type="password" id="confirmPass" value="password123" class="w-full pl-9 pr-3 py-2.5 border border-outline-variant rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-royal-purple" placeholder="Ulangi password">
            </div>
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-royal-purple hover:bg-primary text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-royal-purple/20 flex items-center justify-center gap-2 cursor-pointer">
            <span>Selesaikan Pendaftaran &amp; Masuk Dashboard</span>
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
        </button>
    </form>

        </div>

        <div class="text-center mt-6 text-xs text-outline">
            <a href="index.html" class="hover:text-royal-purple inline-flex items-center gap-1 transition-colors">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span> Kembali ke Beranda Utama
            </a>
        </div>
    </div>
</body>
</html>
