<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - NursePulse Academy</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Tailwind CSS with Landing Page config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#834DFB",
                        "on-primary": "#ffffff",
                        "primary-container": "#ECE4FD",
                        "on-primary-container": "#310B78",
                        "primary-fixed": "#EDE5FE",
                        "primary-fixed-dim": "#D2BEFC",
                        "on-primary-fixed": "#18102B",
                        "on-primary-fixed-variant": "#5826BC",
                        "inverse-primary": "#C4ABFC",

                        "secondary": "#F0E100",
                        "on-secondary": "#18102B",
                        "secondary-container": "#FEFCE8",
                        "on-secondary-container": "#18102B",
                        "secondary-fixed": "#F0E100",
                        "secondary-fixed-dim": "#E6D700",
                        "on-secondary-fixed": "#18102B",
                        "on-secondary-fixed-variant": "#18102B",

                        "tertiary": "#D97706",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#FEF9C3",
                        "on-tertiary-container": "#713F12",
                        "tertiary-fixed": "#FEF08A",
                        "tertiary-fixed-dim": "#FDE047",
                        "on-tertiary-fixed": "#18102B",
                        "on-tertiary-fixed-variant": "#713F12",

                        "background": "#F5F3FF",
                        "on-background": "#18102B",

                        "surface": "#F5F3FF",
                        "on-surface": "#18102B",
                        "surface-variant": "#ECE7FD",
                        "on-surface-variant": "#585175",
                        "surface-dim": "#DCD5F7",
                        "surface-bright": "#FAFAFF",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#F5F3FF",
                        "surface-container": "#EAE5FA",
                        "surface-container-high": "#E0DAF7",
                        "surface-container-highest": "#D5CEF4",
                        "surface-tint": "#834DFB",

                        "outline": "#7D759B",
                        "outline-variant": "#DDD7F3",

                        "inverse-surface": "#18102B",
                        "inverse-on-surface": "#F5F3FF",

                        "error": "#BA1A1A",
                        "on-error": "#ffffff",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#93000A",

                        "electric-violet": "#834DFB",
                        "turbo": "#F0E100",
                        "haiti": "#18102B",
                        "blue-chalk": "#F5F3FF"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "sans": ["'Source Sans 3'", "sans-serif"],
                        "display": ["Manrope", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"],
                        "body-md": ["'Source Sans 3'", "sans-serif"],
                        "label-md": ["'Source Sans 3'", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .auth-pattern {
            background-image: radial-gradient(circle at 100% 0%, rgba(131, 77, 251, 0.18) 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, rgba(240, 225, 0, 0.12) 0%, transparent 50%),
                              radial-gradient(circle at 50% 50%, rgba(24, 16, 43, 0.04) 0%, transparent 70%);
        }
    </style>
</head>
<body class="font-body-md text-on-surface overflow-x-hidden min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative bg-[#18102B]">
    <!-- Background Image with Purple Overlay -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <img src="background/background login dan daftar.jpg" alt="Background" class="w-full h-full object-cover">
        <!-- Purple Tint & Overlay -->
        <div class="absolute inset-0 bg-[#3b1975]/80 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#140b24]/90 via-[#6045F4]/40 to-[#18102B]/80"></div>
    </div>

    <div class="max-w-md w-full space-y-6 bg-surface-container-lowest/95 backdrop-blur-xl p-8 rounded-3xl shadow-2xl shadow-black/40 border border-white/30 relative z-10">
        <!-- Back Link inside Card -->
        <div class="flex items-center justify-between -mt-2">
            <a href="index.html"
                class="inline-flex items-center gap-1.5 text-xs font-semibold text-on-surface-variant hover:text-primary transition-colors py-1 px-2.5 rounded-lg hover:bg-surface-container-low group">
                <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                <span>Kembali ke Beranda</span>
            </a>
        </div>

        <div class="text-center pt-1">
            <a href="index.html" class="inline-flex items-center justify-center mb-3">
                <img src="logo/logo.png" alt="NursePulse Academy Logo" class="h-14 w-auto object-contain">
            </a>
            <p class="text-sm text-on-surface-variant font-medium">Platform Pelatihan &amp; Sertifikasi Perawat Klinis</p>
        </div>

        <div class="mt-8">
            <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" novalidate class="space-y-6">
                <div>
                    <label class="block font-label-md text-sm font-medium text-on-surface mb-1" for="email">Alamat Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-on-surface-variant text-[20px]">mail</span>
                        </div>
                        <input type="email" id="email" name="email" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md leading-5 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition duration-150 ease-in-out" placeholder="perawat@domain.com" autofocus>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block font-label-md text-sm font-medium text-on-surface" for="password">Password</label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
                        </div>
                        <input type="password" id="password" name="password" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md leading-5 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition duration-150 ease-in-out" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded cursor-pointer">
                        <label for="remember" class="ml-2 block text-sm text-on-surface-variant font-body-md cursor-pointer select-none">
                            Ingat saya di perangkat ini
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-label-md font-medium text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200">
                    Masuk <span class="material-symbols-outlined text-[20px]">login</span>
                </button>
            </form>

            <div class="mt-6 text-center text-sm font-body-md text-on-surface-variant">
                Belum memiliki akun? <a href="register.html" class="font-medium text-primary hover:text-primary/80 transition-colors duration-200">Daftar sekarang</a>
            </div>
        </div>
    </div>
</body>
</html>
