<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Verifikasi OTP Email - NursePulse Academy</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'background': '#F8F9FA',
                        'surface-card-white': '#FFFFFF',
                        'surface-container-lowest': '#FFFFFF',
                        'surface-container-low': '#F3F4F6',
                        'surface-container': '#E5E7EB',
                        'surface-container-high': '#D1D5DB',
                        'surface-bright': '#FFFFFF',
                        'carbon-black': '#0F1417',
                        'soft-gray': '#E2E8F0',
                        'royal-purple': '#6045F4',
                        'primary': '#6045F4',
                        'primary-container': '#7C64F6',
                        'primary-fixed': '#E8E5FE',
                        'secondary': '#00877A',
                        'neon-mint': '#53E6D4',
                        'secondary-fixed': '#C6F8F2',
                        'secondary-fixed-dim': '#53E6D4',
                        'ce-credit-gold': '#F59E0B',
                        'clinical-danger': '#EF4444',
                        'error-container': '#FEE2E2',
                        'on-surface': '#0F1417',
                        'on-surface-variant': '#475569',
                        'outline': '#94A3B8',
                        'outline-variant': '#CBD5E1',
                    },
                    fontFamily: {
                        'headline-lg': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'headline-md': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'headline-sm': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'title-md': ['"Plus Jakarta Sans"', '"Manrope"', 'sans-serif'],
                        'body-md': ['"Source Sans 3"', '"Manrope"', 'sans-serif'],
                        'body-sm': ['"Source Sans 3"', '"Manrope"', 'sans-serif'],
                        'label-md': ['"Manrope"', 'sans-serif'],
                        'label-caps': ['"Plus Jakarta Sans"', 'sans-serif'],
                        'metric-digit': ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body class="bg-[#F5F3FF] min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block">
                <img src="logo/logo.png" alt="NursePulse Academy" class="h-12 w-auto mx-auto object-contain" onerror="this.onerror=null; this.src='https://placehold.co/180x45/6045f4/ffffff?text=NursePulse';">
            </a>
            <p class="text-xs text-outline font-label-caps mt-2 uppercase tracking-wider">Portal Pembelajaran &amp; Akreditasi Perawat</p>
        </div>

        <!-- Auth Card -->
        <div class="bg-surface-card-white rounded-3xl p-6 sm:p-8 shadow-xl border border-soft-gray">
            
    <div class="w-14 h-14 rounded-2xl bg-primary-fixed text-royal-purple flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-[32px]">mark_email_read</span>
    </div>
    <h2 class="text-2xl font-headline-md font-bold text-carbon-black text-center mb-1">Verifikasi Email</h2>
    <p class="text-xs text-on-surface-variant text-center mb-6">Kami telah mengirimkan 6 digit kode OTP ke email Anda.</p>

    <form onsubmit="event.preventDefault(); window.location='create-password.html';" novalidate class="space-y-5">
        <div>
            <label class="block text-xs font-bold text-carbon-black text-center mb-2" for="otp">Masukkan 6 Digit OTP</label>
            <input type="text" id="otp" maxlength="6" value="749215" class="w-full py-3 px-3 border border-outline-variant rounded-xl text-center font-bold text-2xl tracking-[10px] focus:outline-none focus:ring-2 focus:ring-royal-purple bg-surface-container-low" placeholder="000000">
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-royal-purple hover:bg-primary text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-royal-purple/20 flex items-center justify-center gap-2 cursor-pointer">
            <span>Verifikasi &amp; Lanjutkan</span>
            <span class="material-symbols-outlined text-[18px]">verified_user</span>
        </button>
    </form>

    <div class="mt-4 text-center text-xs text-on-surface-variant">
        Tidak menerima kode? <button type="button" onclick="alert('Kode OTP baru telah dikirimkan ulang ke email Anda.')" class="font-bold text-royal-purple hover:underline cursor-pointer">Kirim Ulang OTP</button>
    </div>

    <div class="mt-6 pt-4 border-t border-soft-gray text-center text-xs text-on-surface-variant">
        <a href="register.html" class="hover:text-royal-purple inline-flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">arrow_back</span> Ganti Email Pendaftaran
        </a>
    </div>

        </div>

        <div class="text-center mt-6 text-xs text-outline">
            <a href="index.html" class="hover:text-royal-purple inline-flex items-center gap-1 transition-colors">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span> Kembali ke Beranda Utama
            </a>
        </div>
    </div>
</body>
</html>
